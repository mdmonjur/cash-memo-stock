<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Bill</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>body{margin:0;background:#eef1f5;font-family:Arial;color:#20252b}.card{max-width:760px;margin:20px auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 3px 14px #0002}.head{display:flex;gap:15px;align-items:center;border-bottom:2px solid #173f67;padding-bottom:12px}.logo{max-width:130px;max-height:70px;object-fit:contain}.title{font-size:24px;font-weight:bold;color:#173f67}.meta{font-size:13px;color:#555;margin-top:3px}.table{width:100%;border-collapse:collapse;margin-top:15px}.table th{background:#173f67;color:#fff}.table th,.table td{border:1px solid #ccc;padding:7px;text-align:center}.total{margin:15px 0 0 auto;max-width:320px}.row{display:flex;justify-content:space-between;padding:6px;border-bottom:1px solid #ddd}.grand{font-weight:bold;font-size:18px}.btns{text-align:center;margin-top:18px}.btn{border:0;border-radius:7px;padding:11px 16px;margin:4px;font-weight:bold;background:#173f67;color:#fff}.notice{padding:12px;background:#fff4d6;border:1px solid #efd28b;border-radius:7px}@media print{body{background:#fff}.card{box-shadow:none;margin:0;max-width:none}.btns{display:none!important}} </style></head><body><div class="card"><div id="content">Loading bill...</div><div class="btns"><button class="btn" onclick="downloadPDF()">⬇ Download Bill PDF</button><button class="btn" onclick="window.print()">🖨 Print Bill</button></div></div><script>
const SUPABASE_URL='https://pxfcrovaikcawhfbqkpd.supabase.co';const SUPABASE_KEY='sb_publishable_0MDeM_nC7PWkobb4OKz9Og_HnvoTf-T';const CLOUD_ID=1;let db={settings:{shop:'YOUR SHOP NAME',phone:'',address:'',email:'',currency:'OMR',logo:''},sales:[]};let sale=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function load(){const inv=new URLSearchParams(location.search).get('bill');if(!inv){document.getElementById('content').innerHTML='<div class="notice">Bill number is missing.</div>';return}try{const r=await fetch(SUPABASE_URL+'/rest/v1/hr_shared_data?id=eq.'+CLOUD_ID+'&select=data',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});if(!r.ok)throw Error('Cloud error');const rows=await r.json();if(rows[0]?.data)db=rows[0].data;sale=(db.sales||[]).find(s=>String(s.invoice).toLowerCase()===String(inv).toLowerCase());if(!sale){document.getElementById('content').innerHTML='<div class="notice">Bill not found.</div>';return}render();}catch(e){document.getElementById('content').innerHTML='<div class="notice">Unable to load this bill. Please check your internet connection.</div>'}}
function render(){const s=sale,cur=db.settings?.currency||'OMR';const items=(s.items||[]).map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.code)}</td><td style="text-align:left">${esc(x.name)}</td><td>${x.qty}</td><td>${Number(x.rate||0).toFixed(2)}</td><td>${(Number(x.qty||0)*Number(x.rate||0)).toFixed(2)}</td></tr>`).join('');document.getElementById('content').innerHTML=`<div class="head">${db.settings?.logo?`<img class="logo" src="${esc(db.settings.logo)}">`:''}<div><div class="title">${esc(db.settings?.shop||'YOUR SHOP NAME')}</div><div class="meta">${esc(db.settings?.address||'')}</div><div class="meta">Phone: ${esc(db.settings?.phone||'')}</div><div class="meta">${esc(db.settings?.email||'')}</div><div class="meta"><b>CASH MEMO</b></div></div></div><p><b>Bill No:</b> ${esc(s.invoice)} &nbsp; <b>Date:</b> ${esc(s.date||'')}</p><p><b>Customer:</b> ${esc(s.customer||'Walk-in')} &nbsp; <b>Phone:</b> ${esc(s.phone||'')}</p><p><b>Address:</b> ${esc(s.address||'')}</p><p><b>Salesman:</b> ${esc(s.salesman||'')}</p><table class="table"><thead><tr><th>#</th><th>Code</th><th>Product</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead><tbody>${items}</tbody></table><div class="total"><div class="row"><span>Subtotal</span><b>${((s.total||0)+(s.discount||0)-(s.tax||0)).toFixed(2)} ${cur}</b></div><div class="row"><span>Discount</span><b>${Number(s.discount||0).toFixed(2)} ${cur}</b></div><div class="row"><span>Tax/VAT</span><b>${Number(s.tax||0).toFixed(2)} ${cur}</b></div><div class="row grand"><span>Grand Total</span><b>${Number(s.total||0).toFixed(2)} ${cur}</b></div><div class="row"><span>Paid</span><b>${Number(s.paid||0).toFixed(2)} ${cur}</b></div><div class="row"><span>Due</span><b>${Number(s.due||0).toFixed(2)} ${cur}</b></div></div>`}
function downloadPDF(){if(!sale||!window.jspdf?.jsPDF)return;const {jsPDF}=window.jspdf,cur=db.settings?.currency||'OMR',doc=new jsPDF({unit:'mm',format:'a4'});let y=15;doc.setFontSize(18);doc.text(String(db.settings?.shop||'YOUR SHOP NAME'),105,y,{align:'center'});y+=7;doc.setFontSize(10);doc.text(String(db.settings?.address||''),105,y,{align:'center'});y+=5;doc.text('Phone: '+String(db.settings?.phone||''),105,y,{align:'center'});y+=8;doc.setFontSize(14);doc.text('CASH MEMO',105,y,{align:'center'});y+=8;doc.setFontSize(10);doc.text('Bill No: '+sale.invoice,14,y);doc.text('Date: '+String(sale.date||''),196,y,{align:'right'});y+=6;doc.text('Customer: '+String(sale.customer||'Walk-in'),14,y);y+=5;doc.text('Phone: '+String(sale.phone||''),14,y);y+=5;doc.text('Address: '+String(sale.address||''),14,y);y+=8;doc.text('Product',14,y);doc.text('Qty',110,y);doc.text('Rate',135,y);doc.text('Amount',170,y);y+=5;doc.line(14,y,196,y);y+=5;(sale.items||[]).forEach(x=>{if(y>275){doc.addPage();y=15}doc.text(String(x.name||''),14,y,{maxWidth:90});doc.text(String(x.qty||0),110,y);doc.text(Number(x.rate||0).toFixed(2),135,y);doc.text((Number(x.qty||0)*Number(x.rate||0)).toFixed(2)+' '+cur,170,y);y+=6});y+=5;doc.text('Discount: '+Number(sale.discount||0).toFixed(2)+' '+cur,120,y);y+=5;doc.text('Tax/VAT: '+Number(sale.tax||0).toFixed(2)+' '+cur,120,y);y+=6;doc.setFontSize(12);doc.text('Grand Total: '+Number(sale.total||0).toFixed(2)+' '+cur,120,y);y+=6;doc.setFontSize(10);doc.text('Paid: '+Number(sale.paid||0).toFixed(2)+' '+cur,120,y);y+=5;doc.text('Due: '+Number(sale.due||0).toFixed(2)+' '+cur,120,y);doc.save(String(sale.invoice).replace(/[^a-z0-9_-]/gi,'_')+'.pdf')}
load();</script></body></html>
